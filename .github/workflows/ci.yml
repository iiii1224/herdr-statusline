name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux
      - name: Assert test preconditions
        run: |
          command -v tmux >/dev/null || { echo "tmux is required"; exit 1; }
          command -v script >/dev/null || { echo "util-linux script is required"; exit 1; }
          tmux -V
          tmux -V | awk '{
            gsub(/[^0-9.]/, "", $2)
            split($2, v, ".")
            if (v[1] < 3 || (v[1] == 3 && v[2] < 4)) {
              print "tmux 3.4 or newer is required, found " $2
              exit 1
            }
          }'
      - name: Install Python dev dependencies
        run: python3 -m pip install -r requirements-dev.txt
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Rust tests
        run: cargo test --locked
      - name: Assert historical tags build
        run: |
          for tag in v0.1.0 v0.1.2; do
            tmp=$(mktemp -d)
            git archive $tag | tar -xC "$tmp"
            (cd "$tmp" && cargo build --release --locked)
            rm -rf "$tmp"
          done
      - name: Build the release helper
        run: cargo build --release --locked
      - name: Python integration tests
        run: |
          python3 -m pytest tests/test_tmux_mouse.py -p no:xdist &
          mouse=$!
          python3 -m pytest --ignore=tests/test_tmux_mouse.py -n auto --dist loadscope &
          rest=$!
          wait $mouse; m=$?
          wait $rest; r=$?
          if [ "$m" -ne 0 ]; then exit "$m"; elif [ "$r" -ne 0 ]; then exit "$r"; fi
      - name: Shell syntax
        run: |
          sh -n bin/hsl-internal
          sh -n scripts/build.sh
          sh -n scripts/install-launcher.sh
          sh -n scripts/lib/shell-quote.sh
          sh -n scripts/launcher-body.sh
          sh -n scripts/run-in-tmux
          sh -n scripts/default-herdr-info.sh
      - name: Shellcheck
        run: |
          # Printed because the codes for a trap-only function differ by
          # version, and a mismatch between this runner and a contributor's
          # machine is otherwise invisible in the failure output.
          shellcheck --version
          shellcheck -s sh \
            bin/hsl-internal \
            scripts/build.sh \
            scripts/install-launcher.sh \
            scripts/lib/shell-quote.sh \
            scripts/launcher-body.sh \
            scripts/run-in-tmux \
            scripts/default-herdr-info.sh

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned to the rust-version declared in Cargo.toml. If this job fails
      # after a dependency update, the declared floor is no longer true:
      # raise it deliberately rather than loosening the pin.
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@v2
      - name: Build and test at the declared MSRV
        run: |
          cargo build --release --locked
          cargo test --locked
