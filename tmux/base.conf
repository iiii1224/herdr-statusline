# Minimal, status-line-only tmux for a disposable herdr-statusline server.
set-option -g prefix None
set-option -g prefix2 None
unbind-key -a
set-option -g mouse off
set-option -g status on
set-option -g remain-on-exit off
set-option -g detach-on-destroy on
set-option -g focus-events on
set-option -sg escape-time 0
# Allow OSC 52 emitted by Herdr to update the outer terminal clipboard.
set-option -s set-clipboard on
# `#W` must not drift: automatic-rename follows the running program.
set-option -gw automatic-rename off

# Two-stage teardown. The session is created detached so the runtime can
# configure it, which requires `off` here; applying it after new-session is
# impossible because tmux would already have destroyed the session and the
# server. The hook flips the policy the moment a client shows up, so a
# disconnect always tears the session down.
set-option -g destroy-unattached off
set-hook -g client-attached "set-option -g destroy-unattached on"
